/* --- css/style.css --- */
/* ============================================================
   AgroSmartHub 3.0 — Global Design System & Landing Styles
   ============================================================ */

/* ─── FONTS & RESET ─── */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Green Palette */
  --green-50: #f0fdf4;
  --green-100: #dcfce7;
  --green-200: #bbf7d0;
  --green-300: #86efac;
  --green-400: #4ade80;
  --green-500: #22c55e;
  --green-600: #16a34a;
  --green-700: #15803d;
  --green-800: #166534;
  --green-900: #14532d;

  /* Teal Accent */
  --teal-400: #2dd4bf;
  --teal-500: #14b8a6;
  --teal-600: #0d9488;

  /* Amber / Warning */
  --amber-400: #fbbf24;
  --amber-500: #f59e0b;

  /* Red / Danger */
  --red-400: #f87171;
  --red-500: #ef4444;
  --red-600: #dc2626;

  /* Orange */
  --orange-400: #fb923c;
  --orange-500: #f97316;

  /* Neutrals Dark */
  --bg-900: #030a05;
  --bg-800: #071a0c;
  --bg-700: #0d2b16;
  --bg-600: #112d1a;
  --surface-1: #0f1f14;
  --surface-2: #162a1c;
  --surface-3: #1c3524;
  --surface-4: #24432e;
  --border: rgba(34, 197, 94, 0.15);
  --border-hover: rgba(34, 197, 94, 0.35);

  /* Text */
  --text-primary: #f0fdf4;
  --text-secondary: #bbf7d0;
  --text-muted: #6b7280;
  --text-dim: #4b5563;

  /* Glass */
  --glass-bg: rgba(15, 31, 20, 0.7);
  --glass-border: rgba(34, 197, 94, 0.12);
  --glass-blur: blur(20px);

  /* Shadows */
  --shadow-green: 0 0 40px rgba(22, 163, 74, 0.15);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 80px rgba(22, 163, 74, 0.25);

  /* Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-2xl: 32px;
  --radius-full: 9999px;

  /* Transitions */
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.15s ease;
  --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);

  /* Spacing */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --space-12: 48px; --space-16: 64px; --space-20: 80px; --space-24: 96px;
}

html { scroll-behavior: smooth; font-size: 16px; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg-900);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-800); }
::-webkit-scrollbar-thumb { background: var(--green-700); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--green-500); }

/* ─── AMBIENT BACKGROUND ─── */
.ambient-bg {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.ambient-orb {
  position: absolute; border-radius: 50%;
  filter: blur(120px); opacity: 0.4;
  animation: drift 20s infinite ease-in-out;
}
.orb-green {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(22,163,74,0.3), transparent 70%);
  top: -200px; left: -200px;
  animation-delay: 0s;
}
.orb-emerald {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(5,150,105,0.2), transparent 70%);
  top: 50%; right: -150px;
  animation-delay: -7s;
}
.orb-teal {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(13,148,136,0.2), transparent 70%);
  bottom: -100px; left: 30%;
  animation-delay: -14s;
}
@keyframes drift {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(40px,-30px) scale(1.05); }
  66% { transform: translate(-30px,40px) scale(0.95); }
}

/* Particles */
.particles { position: absolute; inset: 0; }
.particle {
  position: absolute; border-radius: 50%;
  background: var(--green-400); opacity: 0.15;
  animation: float-particle linear infinite;
}
@keyframes float-particle {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.15; }
  90% { opacity: 0.1; }
  100% { transform: translateY(-20vh) scale(1); opacity: 0; }
}

/* ─── GLASS PANEL ─── */
.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
}
.glass-card {
  background: rgba(15, 31, 20, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  transition: border-color var(--transition), box-shadow var(--transition);
}
.glass-card:hover {
  border-color: var(--border-hover);
  box-shadow: var(--shadow-green);
}

/* ─── GRADIENTS ─── */
.gradient-green {
  background: linear-gradient(135deg, var(--green-400), var(--teal-400));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.gradient-gold {
  background: linear-gradient(135deg, var(--amber-400), var(--orange-400));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ─── BUTTONS ─── */
.btn-hero-primary {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: 14px 28px; border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--green-600), var(--teal-600));
  color: white; font-family: 'Outfit', sans-serif;
  font-size: 1rem; font-weight: 600; border: none;
  cursor: pointer; transition: var(--transition);
  box-shadow: 0 4px 24px rgba(22,163,74,0.4);
  position: relative; overflow: hidden;
}
.btn-hero-primary::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, var(--green-500), var(--teal-500));
  opacity: 0; transition: opacity 0.3s;
}
.btn-hero-primary:hover::before { opacity: 1; }
.btn-hero-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(22,163,74,0.5); }
.btn-hero-primary svg { width: 18px; height: 18px; position: relative; z-index: 1; }
.btn-hero-primary span, .btn-hero-primary > * { position: relative; z-index: 1; }

.btn-hero-ghost {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: 14px 28px; border-radius: var(--radius-full);
  background: rgba(22,163,74,0.1); color: var(--green-400);
  font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 600;
  border: 1px solid var(--green-700); cursor: pointer;
  transition: var(--transition);
}
.btn-hero-ghost:hover {
  background: rgba(22,163,74,0.2);
  border-color: var(--green-500);
  transform: translateY(-2px);
}
.btn-hero-ghost svg { width: 18px; height: 18px; }

.btn-green-sm {
  padding: 8px 18px; border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--green-600), var(--teal-600));
  color: white; font-family: 'Outfit', sans-serif;
  font-size: 0.875rem; font-weight: 600; border: none;
  cursor: pointer; transition: var(--transition);
}
.btn-green-sm:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(22,163,74,0.4); }

.btn-ghost-sm {
  padding: 8px 18px; border-radius: var(--radius-full);
  background: transparent; color: var(--green-400);
  font-family: 'Outfit', sans-serif; font-size: 0.875rem; font-weight: 500;
  border: 1px solid var(--border); cursor: pointer; transition: var(--transition);
}
.btn-ghost-sm:hover { border-color: var(--green-500); background: rgba(22,163,74,0.1); }

.btn-auth {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--green-600), var(--teal-600));
  color: white; border: none; border-radius: var(--radius-md);
  font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  margin-top: var(--space-4);
}
.btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(22,163,74,0.4); }

.btn-auth-ghost {
  padding: 14px 24px;
  background: rgba(22,163,74,0.1); color: var(--green-400);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 500;
  cursor: pointer; transition: var(--transition);
}
.btn-auth-ghost:hover { background: rgba(22,163,74,0.2); }

.btn-locate {
  padding: 10px 16px;
  background: rgba(22,163,74,0.15); color: var(--green-400);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'Outfit', sans-serif; font-size: 0.875rem;
  cursor: pointer; transition: var(--transition); width: 100%;
}
.btn-locate:hover { background: rgba(22,163,74,0.25); }

/* ─── NAVIGATION (Landing) ─── */
.land-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 16px 0;
  transition: var(--transition);
}
.land-nav.scrolled {
  background: rgba(3, 10, 5, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.nav-container {
  max-width: 1280px; margin: 0 auto; padding: 0 var(--space-6);
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo {
  display: flex; align-items: center; gap: var(--space-3);
  text-decoration: none;
}
.logo-icon {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm); overflow: hidden;
}
.logo-icon.small { width: 32px; height: 32px; }
.logo-text { display: flex; flex-direction: column; }
.logo-primary { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); line-height: 1; }
.logo-accent { color: var(--green-400); }
.logo-version {
  font-size: 0.65rem; font-weight: 600; color: var(--green-500);
  background: rgba(22,163,74,0.15);
  border-radius: var(--radius-full); padding: 1px 6px;
  width: fit-content; margin-top: 2px;
}
.nav-menu {
  list-style: none; display: flex; gap: var(--space-8);
}
.nav-item {
  color: var(--text-secondary); text-decoration: none;
  font-weight: 500; font-size: 0.9rem; transition: color var(--transition);
}
.nav-item:hover { color: var(--green-400); }
.nav-cta { display: flex; align-items: center; gap: var(--space-3); }
.hamburger {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer; padding: 4px;
}
.hamburger span {
  display: block; width: 22px; height: 2px;
  background: var(--text-primary); border-radius: 2px;
  transition: var(--transition);
}

/* ─── HERO SECTION ─── */
.hero-section {
  min-height: 100vh; display: flex; flex-direction: column;
  justify-content: center; padding-top: 80px;
  position: relative; overflow: hidden;
}
.hero-container {
  max-width: 1280px; margin: 0 auto; padding: var(--space-16) var(--space-6);
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--space-16); align-items: center;
  position: relative; z-index: 1;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: var(--space-2);
  background: rgba(22,163,74,0.12); border: 1px solid rgba(22,163,74,0.3);
  padding: 6px 14px; border-radius: var(--radius-full);
  font-size: 0.8rem; font-weight: 600; color: var(--green-400);
  margin-bottom: var(--space-5); width: fit-content;
}
.badge-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green-400);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}
.hero-title {
  font-size: clamp(2.5rem, 5vw, 4rem);
  font-weight: 900; line-height: 1.1;
  margin-bottom: var(--space-6);
}
.title-line { display: block; }
.hero-desc {
  font-size: 1.1rem; color: var(--text-secondary);
  line-height: 1.7; margin-bottom: var(--space-8); max-width: 520px;
}
.hero-actions {
  display: flex; gap: var(--space-4); margin-bottom: var(--space-10);
  flex-wrap: wrap;
}
.hero-trust {
  display: flex; align-items: center; gap: var(--space-6);
  flex-wrap: wrap;
}
.trust-item { display: flex; flex-direction: column; }
.trust-item > span:first-child, .trust-num {
  font-size: 1.4rem; font-weight: 800; color: var(--green-400);
}
.trust-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
.trust-divider { width: 1px; height: 30px; background: var(--border); }

/* ─── PHONE MOCKUP ─── */
.hero-visual { position: relative; display: flex; justify-content: center; }
.hero-phone-mockup { position: relative; z-index: 1; }
.phone-frame {
  width: 280px; background: var(--surface-1);
  border-radius: 36px; padding: 12px;
  border: 2px solid var(--border);
  box-shadow: 0 40px 80px rgba(0,0,0,0.6), var(--shadow-green);
  animation: phone-float 6s ease-in-out infinite;
}
@keyframes phone-float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.phone-screen {
  background: var(--bg-800); border-radius: 28px;
  overflow: hidden; min-height: 520px;
}
.phone-header {
  padding: 12px 16px 4px; display: flex;
  align-items: center; justify-content: space-between;
}
.phone-status { font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); }
.phone-notch {
  width: 80px; height: 20px; background: var(--bg-900);
  border-radius: var(--radius-full);
}
.phone-content { padding: 8px 12px 16px; }
.phone-app-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0 12px; font-size: 0.8rem; font-weight: 700; color: var(--text-primary);
}
.phone-logo-mini { font-size: 1rem; }
.phone-notif {
  margin-left: auto; background: var(--red-500);
  color: white; font-size: 0.6rem; font-weight: 700;
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.phone-weather-card {
  background: linear-gradient(135deg, rgba(22,163,74,0.2), rgba(13,148,136,0.2));
  border: 1px solid var(--border); border-radius: 12px;
  padding: 10px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.weather-icon { font-size: 1.5rem; }
.weather-temp { font-size: 1rem; font-weight: 700; }
.weather-loc { font-size: 0.65rem; color: var(--text-muted); }
.weather-details { margin-left: auto; display: flex; flex-direction: column; gap: 2px; font-size: 0.65rem; color: var(--text-secondary); }
.phone-ai-card {
  background: rgba(22,163,74,0.08); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.ai-scan-icon { font-size: 1.1rem; }
.ai-title { font-size: 0.65rem; color: var(--text-muted); }
.ai-result { font-size: 0.7rem; font-weight: 600; }
.ai-result.healthy { color: var(--green-400); }
.ai-result.diseased { color: var(--red-400); }
.phone-sensors {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px; margin-bottom: 8px;
}
.sensor-mini {
  background: rgba(15,31,20,0.6); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 8px;
  display: flex; align-items: center; gap: 4px; font-size: 0.65rem;
}
.phone-price-card {
  background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2);
  border-radius: 8px; padding: 8px 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.65rem; color: var(--text-secondary);
}
.price-up { color: var(--green-400); font-weight: 600; }
.phone-glow {
  position: absolute; bottom: -40px; left: 50%;
  transform: translateX(-50%);
  width: 200px; height: 60px;
  background: radial-gradient(ellipse, rgba(22,163,74,0.3), transparent 70%);
  filter: blur(20px);
}

/* Floating Cards */
.float-card {
  position: absolute; background: var(--glass-bg);
  backdrop-filter: blur(20px); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  min-width: 160px; box-shadow: var(--shadow-card);
  animation: float-card-anim 4s ease-in-out infinite;
}
.fc-ai { top: 60px; right: -20px; animation-delay: 0s; }
.fc-cert { top: 50%; right: -40px; transform: translateY(-50%); animation-delay: -1.5s; }
.fc-price { bottom: 60px; left: -20px; animation-delay: -3s; }
@keyframes float-card-anim {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.fc-cert { animation: float-card-cert 4s ease-in-out infinite -1.5s; }
@keyframes float-card-cert {
  0%,100% { transform: translateY(-50%); }
  50% { transform: translateY(calc(-50% - 8px)); }
}
.fc-icon { font-size: 1.3rem; }
.fc-title { font-size: 0.65rem; color: var(--text-muted); font-weight: 500; }
.fc-value { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
.fc-conf { font-size: 0.65rem; color: var(--green-400); font-weight: 500; }

/* Scroll Indicator */
.scroll-indicator {
  position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--text-muted); font-size: 0.75rem; z-index: 1;
  animation: bounce-slow 2s infinite;
}
.scroll-mouse {
  width: 24px; height: 36px; border: 2px solid var(--text-muted);
  border-radius: 12px; display: flex; justify-content: center; padding-top: 6px;
}
.scroll-wheel {
  width: 4px; height: 8px; background: var(--green-400);
  border-radius: 2px; animation: scroll-wheel 2s infinite;
}
@keyframes scroll-wheel { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(12px); } }
@keyframes bounce-slow { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-5px); } }

/* ─── SECTIONS ─── */
.section-container { max-width: 1280px; margin: 0 auto; padding: var(--space-24) var(--space-6); position: relative; z-index: 1; }
.section-header { text-align: center; margin-bottom: var(--space-16); }
.section-tag {
  display: inline-block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em;
  color: var(--green-400); background: rgba(22,163,74,0.1);
  padding: 4px 12px; border-radius: var(--radius-full);
  border: 1px solid rgba(22,163,74,0.2); margin-bottom: var(--space-4);
}
.section-title { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 800; line-height: 1.2; margin-bottom: var(--space-4); }
.section-desc { color: var(--text-secondary); font-size: 1rem; max-width: 540px; margin: 0 auto; }

/* ─── FEATURES GRID ─── */
.features-section { background: var(--surface-1); }
.features-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--space-6);
}
.feature-card {
  background: var(--glass-bg); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--space-6); cursor: default;
  transition: var(--transition); position: relative; overflow: hidden;
}
.feature-card::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(22,163,74,0.05), transparent);
  opacity: 0; transition: opacity 0.3s;
}

  transition: border-color var(--transition);
}
.topbar-search:focus-within { border-color: var(--green-700); }
.topbar-search svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
.topbar-search input {
  background: none; border: none; color: var(--text-primary);
  font-size: 0.8rem; width: 100%; padding: 0;
}
.topbar-search input:focus { box-shadow: none; }
.topbar-right { display: flex; align-items: center; gap: var(--space-3); }
.topbar-icon-btn {
  position: relative; width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-muted); display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; cursor: pointer; transition: var(--transition);
}
.topbar-icon-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
.topbar-notif-dot {
  position: absolute; top: 2px; right: 2px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--red-500); border: 2px solid var(--bg-900);
}
.topbar-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green-600), var(--teal-600));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; font-weight: 700; cursor: pointer;
  border: 2px solid var(--green-700);
}

/* ─── PAGE CONTENT ─── */
.page-content { flex: 1; overflow-y: auto; padding: var(--space-6); }

/* ─── DASHBOARD GRID ─── */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-5);
  margin-bottom: var(--space-6);
}

/* Metric Cards */
.metric-card {
  background: rgba(15, 31, 20, 0.7);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  transition: var(--transition);
  position: relative; overflow: hidden;
  cursor: default;
}
.metric-card::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 3px; background: var(--card-color, var(--green-600));
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}
.metric-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-green); border-color: var(--border-hover); }
.metric-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-4); }
.metric-icon { font-size: 1.3rem; }
.metric-change {
  font-size: 0.7rem; font-weight: 600; padding: 2px 8px;
  border-radius: var(--radius-full);
}
.change-up { background: rgba(34,197,94,0.15); color: var(--green-400); }
.change-down { background: rgba(239,68,68,0.15); color: var(--red-400); }
.change-neu { background: rgba(107,114,128,0.15); color: var(--text-muted); }
.metric-value { font-size: 1.6rem; font-weight: 800; line-height: 1; margin-bottom: var(--space-1); }
.metric-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
.metric-sub { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; }

/* ─── WEATHER WIDGET ─── */
.weather-widget {
  background: linear-gradient(135deg, rgba(22,163,74,0.12), rgba(13,148,136,0.12));
  border: 1px solid rgba(22,163,74,0.2);
  border-radius: var(--radius-lg); padding: var(--space-6);
  display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-5); align-items: center;
}
.weather-main { display: flex; flex-direction: column; gap: 4px; }
.weather-big-temp { font-size: 2.5rem; font-weight: 900; color: var(--text-primary); line-height: 1; }
.weather-condition { font-size: 0.9rem; color: var(--text-secondary); }
.weather-location { font-size: 0.75rem; color: var(--text-muted); }
.weather-big-icon { font-size: 3.5rem; }
.weather-details-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3);
}
.weather-detail-item { display: flex; flex-direction: column; gap: 2px; }
.weather-detail-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.weather-detail-value { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }

/* ─── IOT SENSOR GRID ─── */
.iot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: var(--space-4);
}
.sensor-card {
  background: rgba(15,31,20,0.7); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-4);
  text-align: center; transition: var(--transition); position: relative; overflow: hidden;
}
.sensor-card:hover { border-color: var(--border-hover); }
.sensor-card.alert-high { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.05); }
.sensor-card.alert-low { border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.05); }
.sensor-pulse {
  position: absolute; top: 8px; right: 8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green-400);
  animation: sensor-blink 2s infinite;
}
.sensor-pulse.alert { background: var(--red-400); }
@keyframes sensor-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.sensor-emoji { font-size: 1.8rem; margin-bottom: var(--space-2); }
.sensor-value { font-size: 1.2rem; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.sensor-name { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.sensor-bar-wrap { margin-top: 8px; background: var(--surface-3); border-radius: 99px; height: 4px; overflow: hidden; }
.sensor-bar-fill { height: 100%; border-radius: 99px; background: var(--green-500); transition: width 0.8s ease; }
.sensor-bar-fill.warn { background: var(--amber-400); }
.sensor-bar-fill.danger { background: var(--red-500); }

/* ─── AI DETECTION PANEL ─── */
.ai-panel { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
.ai-upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius-lg);
  padding: var(--space-10); text-align: center; cursor: pointer;
  transition: var(--transition); position: relative; overflow: hidden;
  background: rgba(22,163,74,0.03);
}
.ai-upload-zone:hover, .ai-upload-zone.drag-over {
  border-color: var(--green-600); background: rgba(22,163,74,0.06);
}
.ai-upload-icon { font-size: 3rem; margin-bottom: var(--space-3); }
.ai-upload-title { font-size: 1rem; font-weight: 700; margin-bottom: var(--space-2); }
.ai-upload-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: var(--space-5); }
.ai-upload-btns { display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; }
.ai-btn {
  padding: 8px 16px; border-radius: var(--radius-full);
  background: rgba(22,163,74,0.12); border: 1px solid rgba(22,163,74,0.3);
  color: var(--green-400); font-family: 'Outfit', sans-serif;
  font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: var(--transition);
}
.ai-btn:hover { background: rgba(22,163,74,0.25); }
.ai-preview-img {
  width: 100%; border-radius: var(--radius-md);
  object-fit: cover; max-height: 250px; display: none;
}
.ai-results { display: none; }
.ai-results.visible { display: block; }
.ai-scanning { display: none; text-align: center; padding: var(--space-8); }
.ai-scanning.visible { display: block; }
.scan-animation {
  width: 80px; height: 80px; border-radius: 50%;
  border: 3px solid var(--border); margin: 0 auto var(--space-4);
  position: relative;
  animation: spin 2s linear infinite;
}
.scan-animation::before {
  content: ''; position: absolute; inset: 4px; border-radius: 50%;
  border: 3px solid transparent; border-top-color: var(--green-400);
}
.ai-result-header {
  display: flex; align-items: center; gap: var(--space-4);
  margin-bottom: var(--space-5);
  padding: var(--space-4); border-radius: var(--radius-md);
  background: rgba(22,163,74,0.06); border: 1px solid var(--border);
}
.ai-result-emoji { font-size: 2.5rem; }
.ai-disease-name { font-size: 1.1rem; font-weight: 800; }
.ai-confidence { font-size: 0.8rem; color: var(--text-muted); }
.ai-severity {
  padding: 3px 10px; border-radius: var(--radius-full);
  font-size: 0.75rem; font-weight: 700; margin-top: 4px; width: fit-content;
}
.sev-healthy { background: rgba(34,197,94,0.15); color: var(--green-400); }
.sev-low { background: rgba(251,191,36,0.15); color: var(--amber-400); }
.sev-medium { background: rgba(249,115,22,0.15); color: var(--orange-400); }
.sev-high { background: rgba(239,68,68,0.15); color: var(--red-400); }
.sev-critical { background: rgba(239,68,68,0.25); color: var(--red-400); border: 1px solid rgba(239,68,68,0.3); }

/* Health Score Ring */
.health-ring-wrap { text-align: center; }
.health-ring { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--surface-3); stroke-width: 10; }
.ring-fill { fill: none; stroke: var(--green-400); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1.5s ease; }
.health-ring-inner { font-size: 1.5rem; font-weight: 800; }
.health-ring-sub { font-size: 0.65rem; color: var(--text-muted); }

/* AI Metrics Table */
.ai-metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.ai-metric { background: var(--surface-2); border-radius: var(--radius-sm); padding: var(--space-3); }
.ai-metric-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.ai-metric-value { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); margin-top: 2px; }

/* ─── MARKETPLACE ─── */
.market-toolbar {
  display: flex; gap: var(--space-4); align-items: center;
  flex-wrap: wrap; margin-bottom: var(--space-6);
}
.market-search {
  flex: 1; min-width: 240px;
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-full); padding: 10px 16px;
}
.market-search input { background: none; border: none; flex: 1; font-size: 0.875rem; padding: 0; color: var(--text-primary); }
.market-search input:focus { box-shadow: none; }
.market-search svg { width: 16px; color: var(--text-muted); flex-shrink: 0; }
.market-filters { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.filter-chip {
  padding: 6px 14px; border-radius: var(--radius-full);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-secondary); font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: var(--transition); font-family: 'Outfit', sans-serif;
}
.filter-chip.active { background: rgba(22,163,74,0.15); border-color: var(--green-600); color: var(--green-400); }
.filter-chip:hover { border-color: var(--border-hover); }

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: var(--space-5);
}
.product-card {
  background: rgba(15,31,20,0.7); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  transition: var(--transition); cursor: pointer;
}
.product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-green); border-color: var(--border-hover); }
.product-img-wrap {
  height: 160px; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.product-emoji { font-size: 4rem; }
.product-img { width: 100%; height: 100%; object-fit: cover; }
.product-cert-badge {
  position: absolute; top: 8px; right: 8px;
  background: rgba(22,163,74,0.9); color: white;
  font-size: 0.6rem; font-weight: 700; padding: 2px 7px;
  border-radius: var(--radius-full);
}
.product-body { padding: var(--space-4); }
.product-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
.product-farmer { font-size: 0.75rem; color: var(--text-muted); margin-bottom: var(--space-3); }
.product-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-2); }
.product-price { font-size: 1.1rem; font-weight: 800; color: var(--green-400); }
.product-unit { font-size: 0.7rem; color: var(--text-muted); }
.product-grade { font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: var(--radius-full); }
.grade-a { background: rgba(22,163,74,0.15); color: var(--green-400); }
.grade-b { background: rgba(251,191,36,0.15); color: var(--amber-400); }
.product-stock { font-size: 0.7rem; color: var(--text-muted); }
.btn-add-cart {
  width: 100%; margin-top: var(--space-3); padding: 8px;
  background: linear-gradient(135deg, var(--green-600), var(--teal-600));
  border: none; border-radius: var(--radius-sm); color: white;
  font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
}
.btn-add-cart:hover { opacity: 0.9; }

/* ─── CERTIFICATE ─── */
.cert-container {
  max-width: 800px; margin: 0 auto;
}
.certificate {
  background: linear-gradient(135deg, #0a1f0e 0%, #0d2b16 50%, #0a1f0e 100%);
  border: 2px solid var(--green-700); border-radius: var(--radius-xl);
  padding: var(--space-10); position: relative; overflow: hidden;
}
.cert-bg-pattern {
  position: absolute; inset: 0; opacity: 0.03;
  background: repeating-linear-gradient(45deg, var(--green-400) 0px, var(--green-400) 1px, transparent 1px, transparent 10px);
  pointer-events: none;
}
.cert-header { text-align: center; margin-bottom: var(--space-6); }
.cert-logo { font-size: 2rem; margin-bottom: var(--space-2); }
.cert-org-name { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.1em; color: var(--green-400); }
.cert-title { font-size: 1.6rem; font-weight: 900; margin: var(--space-2) 0; }
.cert-subtitle { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.05em; }
.cert-divider { border: none; border-top: 1px solid var(--green-800); margin: var(--space-5) 0; }
.cert-body { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); margin-bottom: var(--space-6); }
.cert-field { margin-bottom: var(--space-3); }
.cert-field-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
.cert-field-value { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); margin-top: 2px; }
.cert-grade-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, var(--green-600), var(--teal-600));
  color: white; padding: 4px 14px; border-radius: var(--radius-full);
  font-size: 0.8rem; font-weight: 700; margin-top: 4px;
}
.cert-qr-section { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
.cert-qr-wrap { background: white; padding: 8px; border-radius: var(--radius-sm); }
.cert-qr-label { font-size: 0.65rem; color: var(--text-muted); text-align: center; }
.cert-blockchain {
  background: rgba(22,163,74,0.06); border: 1px solid rgba(22,163,74,0.2);
  border-radius: var(--radius-sm); padding: var(--space-4); margin: var(--space-5) 0;
  display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
}
.cert-blockchain-icon { font-size: 1.3rem; }
.cert-blockchain-text { flex: 1; }
.cert-blockchain-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
.cert-blockchain-id { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--green-400); word-break: break-all; }
.cert-status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 14px; border-radius: var(--radius-full);
  font-size: 0.8rem; font-weight: 700;
}
.cert-status-certified { background: rgba(22,163,74,0.2); color: var(--green-400); border: 1px solid rgba(22,163,74,0.3); }
.cert-footer {
  display: flex; justify-content: space-between; align-items: flex-end;
  flex-wrap: wrap; gap: var(--space-4);
}
.cert-signature { text-align: center; }
.cert-sig-line { width: 150px; border-top: 1px solid var(--border); margin-bottom: 4px; }
.cert-sig-name { font-size: 0.7rem; color: var(--text-muted); }
.cert-id { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim); }
.cert-actions { display: flex; gap: var(--space-3); margin-top: var(--space-6); flex-wrap: wrap; }
.btn-cert {
  flex: 1; min-width: 120px; padding: 12px;
  border-radius: var(--radius-sm); border: none;
  font-family: 'Outfit', sans-serif; font-size: 0.875rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-cert-primary { background: linear-gradient(135deg, var(--green-600), var(--teal-600)); color: white; }
.btn-cert-secondary { background: rgba(22,163,74,0.12); color: var(--green-400); border: 1px solid rgba(22,163,74,0.3) !important; }
.btn-cert:hover { opacity: 0.9; transform: translateY(-1px); }

/* ─── SUPPLY CHAIN MAP ─── */
.supply-chain-panel { display: grid; grid-template-columns: 1fr 380px; gap: var(--space-6); }
#supplyMap { height: 500px; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); }

.supply-step {
  display: flex; gap: var(--space-4); margin-bottom: var(--space-4); position: relative;
}
.supply-step::before {
  content: ''; position: absolute; left: 20px; top: 44px; bottom: -16px;
  width: 2px; background: var(--border);
}
.supply-step:last-child::before { display: none; }
.supply-dot {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1rem;
  background: var(--surface-3); border: 2px solid var(--border);
  z-index: 1; position: relative;
}
.supply-dot.active { background: rgba(22,163,74,0.2); border-color: var(--green-600); }
.supply-dot.done { background: rgba(22,163,74,0.3); border-color: var(--green-500); }
.supply-info { flex: 1; }
.supply-step-name { font-size: 0.875rem; font-weight: 700; margin-bottom: 2px; }
.supply-step-detail { font-size: 0.75rem; color: var(--text-muted); }
.supply-step-time { font-size: 0.7rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

/* ─── CHARTS ─── */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--space-5); }
.chart-card {
  background: rgba(15,31,20,0.7); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-5);
}
.chart-card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: var(--space-4); display: flex; align-items: center; justify-content: space-between; }
.chart-canvas { width: 100% !important; }

/* ─── NOTIFICATIONS PANEL ─── */
.notifications-list { display: flex; flex-direction: column; gap: var(--space-3); }
.notif-item {
  display: flex; gap: var(--space-4); padding: var(--space-4);
  background: rgba(15,31,20,0.6); border: 1px solid var(--border);
  border-radius: var(--radius-md); cursor: default; transition: var(--transition);
}
.notif-item:hover { border-color: var(--border-hover); }
.notif-item.unread { border-left: 3px solid var(--green-500); }
.notif-icon { font-size: 1.3rem; width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.notif-body { flex: 1; }
.notif-title { font-size: 0.875rem; font-weight: 700; margin-bottom: 4px; }
.notif-desc { font-size: 0.78rem; color: var(--text-muted); }
.notif-time { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-400); flex-shrink: 0; margin-top: 6px; }

/* ─── PROFILE / FARMER CARD ─── */
.farmer-profile-card {
  background: linear-gradient(135deg, rgba(22,163,74,0.1), rgba(13,148,136,0.1));
  border: 1px solid rgba(22,163,74,0.2); border-radius: var(--radius-xl);
  padding: var(--space-8); text-align: center; position: relative;
}
.profile-avatar {
  width: 90px; height: 90px; border-radius: 50%; margin: 0 auto var(--space-4);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem; font-weight: 800; color: white;
  border: 4px solid var(--green-700);
  background: linear-gradient(135deg, var(--green-600), var(--teal-600));
}
.profile-name { font-size: 1.2rem; font-weight: 800; margin-bottom: 4px; }
.profile-id { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
.profile-badges { display: flex; justify-content: center; gap: var(--space-2); flex-wrap: wrap; margin: var(--space-3) 0; }
.profile-badge { font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-full); }

      backdrop-filter: blur(20px);
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 30px rgba(22, 163, 74, .4);
    }

    .profile-name {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .profile-id {
      font-size: .7rem;
      color: rgba(107, 114, 128, .7);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 12px;
    }

    .profile-badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .profile-badge {
      font-size: .7rem;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 600;
    }

    .badge-verified {
      background: rgba(22, 163, 74, .15);
      border: 1px solid rgba(22, 163, 74, .3);
      color: #4ade80;
    }

    .badge-organic {
      background: rgba(13, 148, 136, .15);
      border: 1px solid rgba(13, 148, 136, .3);
      color: #2dd4bf;
    }

    .profile-stats {
      display: flex;
      justify-content: space-around;
      padding: 16px 0;
      border-top: 1px solid rgba(34, 197, 94, .1);
      border-bottom: 1px solid rgba(34, 197, 94, .1);
      margin-bottom: 16px;
    }

    .profile-stat-num {
      font-size: 1.2rem;
      font-weight: 800;
      color: #4ade80;
    }

    .profile-stat-label {
      font-size: .65rem;
      color: rgba(107, 114, 128, .7);
      margin-top: 2px;
    }

    .profile-qr {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 16px;
    }

    .profile-qr-wrap {
      padding: 8px;
      background: #fff;
      border-radius: 8px;
      display: inline-block;
    }

    /* ─── STATUS BADGES ─── */
    .status-badge {
      font-size: .72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .status-active {
      background: rgba(22, 163, 74, .15);
      color: #4ade80;
      border: 1px solid rgba(22, 163, 74, .2);
    }

    .status-pending {
      background: rgba(251, 191, 36, .12);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, .2);
    }

    .status-completed {
      background: rgba(37, 99, 235, .12);
      color: #60a5fa;
      border: 1px solid rgba(37, 99, 235, .2);
    }

    .status-rejected {
      background: rgba(239, 68, 68, .12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, .2);
    }

    /* ─── BUTTONS ─── */
    .btn-xs {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(34, 197, 94, .25);
      background: rgba(22, 163, 74, .1);
      color: #4ade80;
      font-family: 'Outfit', sans-serif;
      font-size: .72rem;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }

    .btn-xs:hover {
      background: rgba(22, 163, 74, .2);
      border-color: rgba(34, 197, 94, .5);
    }

    .btn-xs.danger {
      border-color: rgba(239, 68, 68, .25);
      background: rgba(239, 68, 68, .08);
      color: #f87171;
    }

    .btn-xs.danger:hover {
      background: rgba(239, 68, 68, .18);
    }

    .btn-primary {
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #16a34a, #0d9488);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: .875rem;
      font-weight: 700;
      cursor: pointer;
      transition: .25s ease;
      box-shadow: 0 4px 16px rgba(22, 163, 74, .3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(22, 163, 74, .45);
    }

    /* ─── TABLES ─── */
    .admin-table-wrap {
      overflow-x: auto;
      border-radius: 10px;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .82rem;
    }

    .admin-table th {
      padding: 10px 14px;
      text-align: left;
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(107, 114, 128, .8);
      border-bottom: 1px solid rgba(34, 197, 94, .1);
      white-space: nowrap;
    }

    .admin-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(34, 197, 94, .06);
      vertical-align: middle;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-table tr:hover td {
      background: rgba(22, 163, 74, .03);
    }

    .price-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .84rem;
    }

    .price-table th {
      padding: 8px 12px;
      text-align: left;
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(107, 114, 128, .7);
      border-bottom: 1px solid rgba(34, 197, 94, .1);
    }

    .price-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(34, 197, 94, .05);
    }

    .price-up-td {
      color: #4ade80;
      font-weight: 700;
    }

    .price-down-td {
      color: #f87171;
      font-weight: 700;
    }

    /* ─── CHARTS ─── */
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .chart-card {
      padding: 20px;
      border-radius: 14px;
      background: rgba(15, 31, 20, .6);
      border: 1px solid rgba(34, 197, 94, .1);
      backdrop-filter: blur(20px);
    }

    .chart-card-title {
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: rgba(187, 247, 208, .8);
    }

    .chart-canvas {
      max-height: 200px;
    }

    @media(max-width:700px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ─── METRIC CARDS ─── */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      padding: 18px;
      border-radius: 14px;
      background: rgba(15, 31, 20, .6);
      border: 1px solid rgba(34, 197, 94, .08);
      backdrop-filter: blur(20px);
      transition: .3s ease;
      position: relative;
      overflow: hidden;
    }

    .metric-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--card-color, #16a34a);
      opacity: .5;
    }

    .metric-card:hover {
      transform: translateY(-4px);
      border-color: rgba(34, 197, 94, .2);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
    }

    .metric-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .metric-icon {
      font-size: 1.4rem;
    }

    .metric-change {
      font-size: .65rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .change-up {
      background: rgba(22, 163, 74, .15);
      color: #4ade80;
    }

    .change-down {
      background: rgba(239, 68, 68, .12);
      color: #f87171;
    }

    .change-neu {
      background: rgba(107, 114, 128, .12);
      color: rgba(107, 114, 128, .8);
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 2px;
      color: var(--card-color, #f0fdf4);
    }

    .metric-label {
      font-size: .72rem;
      font-weight: 600;
      color: rgba(187, 247, 208, .7);
    }

    .metric-sub {
      font-size: .65rem;
      color: rgba(107, 114, 128, .6);
      margin-top: 4px;
    }

    /* ─── NOTIFICATIONS ─── */
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(34, 197, 94, .06);
      transition: .2s ease;
      cursor: pointer;
    }

    .notif-item:hover {
      background: rgba(34, 197, 94, .04);
    }

    .notif-item.unread {
      border-color: rgba(34, 197, 94, .15);
      background: rgba(22, 163, 74, .04);
    }

    .notif-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .notif-body {
      flex: 1;
      min-width: 0;
    }

    .notif-title {
      font-size: .83rem;
      font-weight: 600;
    }

    .notif-desc {
      font-size: .75rem;
      color: rgba(187, 247, 208, .65);
      margin-top: 2px;
    }

    .notif-time {
      font-size: .65rem;
      color: rgba(107, 114, 128, .6);
      margin-top: 4px;
    }

    .notif-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
      margin-top: 6px;
      box-shadow: 0 0 6px #4ade80;
    }

    /* ─── PRODUCTS ─── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .product-card {
      border-radius: 12px;
      overflow: hidden;
      background: rgba(15, 31, 20, .6);
      border: 1px solid rgba(34, 197, 94, .1);
      transition: .3s ease;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .4);
    }

    .product-img {
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      background: rgba(0, 0, 0, .2);
    }

    .product-body {
      padding: 14px;
    }

    .product-name {
      font-size: .88rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 800;
      color: #4ade80;
    }

    .product-farmer {
      font-size: .7rem;
      color: rgba(107, 114, 128, .7);
      margin-top: 4px;
    }

    .product-badge {
      display: inline-block;
      font-size: .62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      margin-top: 8px;
      background: rgba(22, 163, 74, .15);
      color: #4ade80;
      border: 1px solid rgba(22, 163, 74, .2);
    }

    .btn-add-cart {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #16a34a, #0d9488);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .btn-add-cart:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(22, 163, 74, .35);
    }

    /* ─── WEATHER WIDGET ─── */
    .weather-widget {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(22, 163, 74, .12), rgba(13, 148, 136, .08));
      border: 1px solid rgba(34, 197, 94, .15);
      backdrop-filter: blur(20px);
    }

    .weather-big-icon {
      font-size: 3.5rem;
      flex-shrink: 0;
    }

    .weather-main {
      flex: 1;
      min-width: 140px;
    }

    .weather-big-temp {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #4ade80, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .weather-condition {
      font-size: .85rem;
      color: rgba(187, 247, 208, .7);
      margin-top: 2px;
    }

    .weather-location {
      font-size: .75rem;
      color: rgba(107, 114, 128, .7);
      margin-top: 4px;
    }

    .weather-details-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      flex: 2;
      min-width: 200px;
    }

    .weather-detail-item {
      text-align: center;
      padding: 10px 6px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .2);
    }

    .weather-detail-label {
      font-size: .62rem;
      color: rgba(107, 114, 128, .7);
      margin-bottom: 4px;
    }

    .weather-detail-value {
      font-size: .9rem;
      font-weight: 700;
      color: #f0fdf4;
    }

    /* ─── IoT ─── */
    .iot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .iot-card {
      padding: 16px;
      border-radius: 12px;
      background: rgba(15, 31, 20, .6);
      border: 1px solid rgba(34, 197, 94, .08);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: .3s ease;
    }

    .iot-card:hover {
      border-color: rgba(34, 197, 94, .25);
      transform: translateY(-3px);
    }

    .iot-card.alert {
      border-color: rgba(239, 68, 68, .4);
      background: rgba(239, 68, 68, .04);
      animation: alertPulse 2s ease-in-out infinite;
    }

    @keyframes alertPulse {

      0%,
      100% {
        border-color: rgba(239, 68, 68, .4)
      }

      50% {
        border-color: rgba(239, 68, 68, .7)
      }
    }

    .iot-icon {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .iot-value {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .iot-label {
      font-size: .68rem;
      color: rgba(107, 114, 128, .7);
    }

    .iot-status {
      font-size: .62rem;
      font-weight: 600;
      margin-top: 6px;
    }

    .iot-status.normal {
      color: #4ade80;
    }

    .iot-status.warn {
      color: #fbbf24;
    }

    .iot-status.crit {
      color: #f87171;
    }

    .iot-live-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: blink 1.5s ease-in-out infinite;
    }

    /* ─── AI DETECTION ─── */
    .upload-zone-lg {
      border: 2px dashed rgba(34, 197, 94, .25);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: .3s ease;
      background: rgba(22, 163, 74, .04);
    }

    .upload-zone-lg:hover {
      border-color: rgba(34, 197, 94, .5);
      background: rgba(22, 163, 74, .08);
    }

    .upload-zone-lg input[type=file] {
      display: none;
    }

    .upload-zone-lg.dragging {
      border-color: #4ade80;
      background: rgba(22, 163, 74, .12);
    }

    .ai-result-card {
      padding: 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(22, 163, 74, .1), rgba(13, 148, 136, .06));
      border: 1px solid rgba(34, 197, 94, .2);
    }

    .ai-progress-bar {
      height: 8px;
      border-radius: 99px;
      background: rgba(0, 0, 0, .3);
      overflow: hidden;
      margin-top: 6px;
    }

    .ai-progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #16a34a, #2dd4bf);
      transition: width 1s ease;
    }

    /* ─── SUPPLY CHAIN ─── */
    .supply-chain-track {
      display: flex;
      gap: 0;
      overflow-x: auto;
      padding: 8px 0;
      margin-bottom: 24px;
    }

    .sc-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 100px;
      position: relative;
    }

    .sc-node:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 20px;
      left: 50%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, rgba(34, 197, 94, .3), rgba(13, 148, 136, .3));
      z-index: 0;
    }

    .sc-icon-wrap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border: 2px solid rgba(34, 197, 94, .3);
      background: rgba(15, 31, 20, .8);
      transition: .3s ease;
    }

    .sc-icon-wrap.done {
      background: linear-gradient(135deg, #16a34a, #0d9488);
      border-color: transparent;
      box-shadow: 0 0 16px rgba(22, 163, 74, .4);
    }

    .sc-icon-wrap.active {
      border-color: #4ade80;
      box-shadow: 0 0 20px rgba(34, 197, 94, .5);
      animation: activePulse 2s ease-in-out infinite;
    }

    @keyframes activePulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(34, 197, 94, .5)
      }

      50% {
        box-shadow: 0 0 35px rgba(34, 197, 94, .8)
      }
    }

    .sc-label {
      font-size: .7rem;
      font-weight: 600;
      color: rgba(187, 247, 208, .7);
      margin-top: 8px;
      text-align: center;
    }

    .sc-time {
      font-size: .6rem;
      color: rgba(107, 114, 128, .6);
      margin-top: 2px;
    }

    /* ─── CERTIFICATES ─── */
    .cert-card {
      padding: 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(22, 163, 74, .06), rgba(13, 148, 136, .04));
      border: 1px solid rgba(34, 197, 94, .12);
      margin-bottom: 16px;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .cert-grade-big {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: linear-gradient(135deg, #16a34a, #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(22, 163, 74, .4);
    }

    .cert-info {
      flex: 1;
      min-width: 180px;
    }

    .cert-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: .65rem;
      color: rgba(107, 114, 128, .7);
    }

    .cert-name {
      font-size: .95rem;
      font-weight: 700;
      margin: 4px 0;
    }

    .cert-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
    }
  </style>
</head>

<body>

  <!-- ░░ LOADING SCREEN ░░ -->
  <div id="appLoading">
    <div class="loading-logo">🌾</div>
    <div class="loading-title">AgroSmartHub 3.0</div>
    <div class="loading-text" id="loadingText">Connecting to database…</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
  </div>

  <!-- ░░ APP SHELL ░░ -->
  <div id="appShell">

    <!-- ── SIDEBAR OVERLAY (mobile) ── -->
    <div id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>

    <!-- ── SIDEBAR ── -->
    <nav id="sidebar" role="navigation" aria-label="Sidebar navigation">

      <!-- Logo -->
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">🌾</div>
          <span class="sidebar-logo-text">AgroSmartHub</span>
        </div>
        <button id="sidebarToggle" aria-label="Collapse sidebar" title="Collapse">◀</button>
      </div>

      <!-- User -->
      <div id="sidebarUser" onclick="navigateTo('profile')" aria-label="User profile" role="button">
        <!-- Populated by JS -->
        <div class="user-avatar-sm" style="background:#16a34a">🌾</div>
        <div class="user-info-sm">
          <div class="user-name-sm">Loading…</div>
          <span class="user-role-sm">Connecting</span>
        </div>
        <div class="user-online-dot"></div>
      </div>

      <!-- Nav items -->
      <div id="sidebarNav" role="list">
        <!-- Populated by renderSidebar() in app.js -->
      </div>

      <!-- Footer -->
      <div class="sidebar-footer">
        <div class="sidebar-version">v3.0.0 • Supabase Connected</div>
        <button class="btn-sidebar-logout" onclick="handleLogout()">
          <span>🚪</span><span class="nav-text">Sign Out</span>
        </button>
      </div>

    </nav>

    <!-- ── MAIN CONTENT ── -->
    <div id="mainContent">

      <!-- Topbar -->
      <header id="topbar" role="banner">
        <div class="topbar-left">
          <button class="topbar-hamburger" onclick="toggleMobileSidebar()" id="hamburgerBtn"
            aria-label="Menu">☰</button>
          <div class="topbar-title-wrap">
            <div id="topbarTitle">Dashboard</div>
            <div id="topbarSub">Loading…</div>
          </div>
        </div>
        <div class="topbar-right">
          <!-- Search -->
          <div class="topbar-search" role="search">
            <span>🔍</span>
            <input type="text" placeholder="Search crops, orders…" id="globalSearch" aria-label="Global search"
              onkeydown="handleGlobalSearch(event)" />

function genId(prefix) {
  return `${prefix}-${Date.now().toString(36).toUpperCase()}`;
}
function genBlockchainId() {
  const chars = '0123456789abcdef';
  return Array.from({length: 64}, () => chars[Math.floor(Math.random() * 16)]).join('');
}
function genCertId(state, crop) {
  const st = state ? state.substring(0,2).toUpperCase() : 'IN';
  return `CERT-${st}-2025-${Math.floor(Math.random()*9000+1000)}`;
}
function randomBetween(min, max) { return (Math.random()*(max-min)+min); }
function randomInt(min, max) { return Math.floor(randomBetween(min, max)); }
function fmtCurrency(n) { return new Intl.NumberFormat('en-IN', {style:'currency',currency:'INR',maximumFractionDigits:0}).format(n); }
function fmtNum(n) {
  if(n >= 10000000) return (n/10000000).toFixed(1) + 'Cr';
  if(n >= 100000) return (n/100000).toFixed(1) + 'L';
  if(n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toString();
}

    if (saved) {
      try { currentUser = JSON.parse(saved); } catch (_) {}

  if (!currentUser) {
    showToast('Please sign in to access your account', 'error');

});

function bootApp() {
  const loading = document.getElementById('appLoading');
  const shell = document.getElementById('appShell');
  const msgs = [
    'Connecting to Supabase…',
    'Initializing AI modules…',
    'Loading IoT sensors…',
    'Fetching market data…',
    'Setting up dashboard…'
  ];
  let i = 0;
  const txtEl = document.getElementById('loadingText');
  const interval = setInterval(() => {
    if (i < msgs.length) { if (txtEl) txtEl.textContent = msgs[i++]; }
  }, 380);
  setTimeout(() => {
    clearInterval(interval);
    if (loading) loading.style.display = 'none';
    if (shell)   shell.style.display = 'flex';
    renderSidebar();
    renderTopbar();
    navigateTo('dashboard');
    initSidebarToggle();

// ─── SIDEBAR ───
function renderSidebar() {
  const role = currentUser.role;

        <span class="user-role-sm">${capitalize(currentUser.role)}</span>
      </div>

  }

  const navEl = document.getElementById('sidebarNav');
  if (!navEl) return;
  let html = '';
  nav.forEach(section => {
    html += `<div class="nav-section"><div class="nav-section-title">${section.section}</div>`;
    section.items.forEach(item => {
      const badge = item.badge ? `<span class="nav-badge">${item.badge}</span>` : '';
      html += `
        <button class="nav-link-item" id="nav-${item.id}" onclick="navigateTo('${item.id}')">

          <span class="nav-text">${item.label}</span>
          ${badge}
        </button>`;
    });
    html += `</div>`;
  });
  navEl.innerHTML = html;
}

function initSidebarToggle() {
  const btn = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');
  if (!btn || !sidebar) return;
  btn.addEventListener('click', () => {
    sidebarCollapsed = !sidebarCollapsed;
    sidebar.classList.toggle('collapsed', sidebarCollapsed);
    btn.textContent = sidebarCollapsed ? '▶' : '◀';
    document.querySelectorAll('.nav-text, .sidebar-version, .user-info-sm, .nav-section-title').forEach(el => {
      el.style.display = sidebarCollapsed ? 'none' : '';
    });
  });
}

function toggleMobileSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const open = sidebar.classList.contains('mobile-open');
  sidebar.classList.toggle('mobile-open', !open);
  if (overlay) overlay.style.display = open ? 'none' : 'block';
}

// ─── TOPBAR ───
function renderTopbar() {

// ─── ROUTER ───
function navigateTo(page) {
  currentPage = page;

  // Update active nav
  document.querySelectorAll('.nav-link-item').forEach(el => {
    el.classList.toggle('active', el.id === `nav-${page}`);
  });

  // Close mobile sidebar
  document.getElementById('sidebar')?.classList.remove('mobile-open');
  const ov = document.getElementById('sidebarOverlay');
  if (ov) ov.style.display = 'none';

  // Render page
  const content = document.getElementById('pageContent');
  if (!content) return;
  content.innerHTML = '';

let lastDetectedDisease = null;

function handleImageUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    showImageAndScan(e.target.result, randomInt(0, ASH.diseases.length - 1));
  };
  reader.readAsDataURL(file);
}

function loadDemoImage() {
  // Use a placeholder SVG as demo image
  const svgData = `<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="300" fill="#0d2b16"/><text x="200" y="140" text-anchor="middle" fill="#22c55e" font-size="60">🍅</text><text x="200" y="200" text-anchor="middle" fill="#bbf7d0" font-size="18">Tomato Crop</text><text x="200" y="225" text-anchor="middle" fill="#6b7280" font-size="12">Sample crop image</text></svg>`;
  const dataUrl = `data:image/svg+xml;base64,${btoa(svgData)}`;
  showImageAndScan(dataUrl, randomInt(0, ASH.diseases.length - 1));
}

function openCamera() {
  const input = document.getElementById('cropImageInput');
  if (input) { input.setAttribute('capture', 'environment'); input.click(); }
}

function showImageAndScan(src, diseaseIdx) {
  const preview = document.getElementById('aiPreviewImg');
  if (preview) { preview.src = src; preview.style.display = 'block'; }
  document.getElementById('aiInitState').style.display = 'none';
  document.getElementById('aiResults').style.display = 'none';
  const scanning = document.getElementById('aiScanning');
  scanning.classList.add('visible');
  runScanAnimation(diseaseIdx);
}

function runScanAnimation(diseaseIdx) {
  const steps = ['Preprocessing image', 'Extracting features', 'Running YOLOv8 model', 'Analyzing leaf patterns', 'Detecting diseases', 'Computing confidence scores', 'Generating recommendations…'];
  const bar = document.getElementById('scanBar');
  const stepEl = document.getElementById('scanningStep');
  let i = 0;
  const interval = setInterval(() => {
    if (stepEl) stepEl.textContent = steps[i] || 'Finalizing…';
    if (bar) bar.style.width = `${Math.min((i / steps.length) * 100, 95)}%`;
    i++;
    if (i >= steps.length) {
      clearInterval(interval);
      setTimeout(() => {
        if (bar) bar.style.width = '100%';
        setTimeout(() => showResults(diseaseIdx), 300);
      }, 400);
    }
  }, 350);
}

async function showResults(diseaseIdx) {
  const disease = ASH.diseases[diseaseIdx];
  lastDetectedDisease = disease;
  const scanning = document.getElementById('aiScanning');
  scanning.classList.remove('visible');

  const results = document.getElementById('aiResults');
  results.classList.add('visible');

  const confidence = randomBetween(disease.confidence[0], disease.confidence[1]).toFixed(1);
  const healthPct = randomBetween(disease.healthPct[0], disease.healthPct[1]).toFixed(0);

  // Health ring
  const ring = document.getElementById('healthRingFill');
  const pctEl = document.getElementById('healthPct');
  const circum = 314;
  if (ring) ring.style.strokeDashoffset = circum - (healthPct / 100) * circum;
  if (ring) ring.style.stroke = healthPct > 75 ? 'var(--green-400)' : healthPct > 50 ? 'var(--amber-400)' : 'var(--red-400)';
  if (pctEl) pctEl.textContent = `${healthPct}%`;

  // Disease info
  document.getElementById('aiResultEmoji').textContent = disease.emoji;
  document.getElementById('aiDiseaseName').textContent = disease.name;
  document.getElementById('aiConfidenceText').textContent = `AI Confidence: ${confidence}%`;
  const sevBadge = document.getElementById('aiSeverityBadge');
  sevBadge.textContent = capitalize(disease.severity);
  sevBadge.className = `ai-severity sev-${disease.severity}`;

  // Metrics
  const metricsGrid = document.getElementById('aiMetricsGrid');
  metricsGrid.innerHTML = [
    {label:'Affected Area', value: disease.affectedArea},
    {label:'Severity', value: capitalize(disease.severity)},
    {label:'Yield Loss Est.', value: disease.yieldLoss},
    {label:'Recovery Time', value: disease.recovery.split('—')[0]||disease.recovery}
  ].map(m => `<div class="ai-metric"><div class="ai-metric-label">${m.label}</div><div class="ai-metric-value">${m.value}</div></div>`).join('');

  // Recommendations
  const recsEl = document.getElementById('aiRecommendations');
  recsEl.innerHTML = `
    <h4 style="font-size:.8rem;font-weight:700;margin-bottom:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em">Treatment Recommendations</h4>
    ${[
      {icon:'💊', label:'Medicine', value: disease.medicine},
      {icon:'🧪', label:'Fertilizer', value: disease.fertilizer},
      {icon:'💧', label:'Water', value: disease.water},
      {icon:'⚠️', label:'Future Risk', value: disease.risk}
    ].map(r => `
      <div style="display:flex;gap:10px;padding:10px;background:rgba(22,163,74,0.05);border-radius:var(--radius-sm);margin-bottom:8px;border-left:2px solid var(--border)">
        <span style="font-size:1rem">${r.icon}</span>
        <div><div style="font-size:.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase">${r.label}</div><div style="font-size:.8rem;color:var(--text-secondary);margin-top:2px">${r.value}</div></div>
      </div>
    `).join('')}
  `;

  // ── Save to Supabase backend API ─────────────────
  try {
    const backendUrl = window.location.protocol === 'file:' ? 'http://localhost:5000' : `${window.location.protocol}//${window.location.hostname}:5000`;
    const token = localStorage.getItem('ash_token');
    await fetch(`${backendUrl}/api/ai/detect`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token && { 'Authorization': `Bearer ${token}` })
      },
      body: JSON.stringify({
        diseaseName: disease.name,
        confidence: parseFloat(confidence)
      })
    });
  } catch (err) {
    console.warn('Backend scan save offline fallback');
  }

  // Save to local history
  saveScanHistory({ disease: disease.name, emoji: disease.emoji, confidence, healthPct, severity: disease.severity });
  renderScanHistory();
  showToast(`Analysis complete: ${disease.name}`, disease.severity === 'healthy' ? 'success' : disease.severity === 'critical' ? 'error' : 'warning');
}

function simulateDetection(idx) {
  // Show the upload zone as active
  document.getElementById('aiInitState').style.display = 'none';
  document.getElementById('aiResults').style.display = 'none';
  const scanning = document.getElementById('aiScanning');
  scanning.classList.add('visible');
  runScanAnimation(idx);
}

// ─── SCAN HISTORY ───
function saveScanHistory(entry) {
  let history = JSON.parse(sessionStorage.getItem('ash_scan_history') || '[]');
  history.unshift({ ...entry, time: new Date().toLocaleTimeString() });
  if (history.length > 5) history = history.slice(0,5);
  sessionStorage.setItem('ash_scan_history', JSON.stringify(history));
}
function getScanHistory() {
  return JSON.parse(sessionStorage.getItem('ash_scan_history') || '[]');
}
function renderScanHistory() {
  const el = document.getElementById('scanHistoryList');
  if (!el) return;
  const history = getScanHistory();
  if (!history.length) {
    el.innerHTML = '<div style="font-size:.75rem;color:var(--text-dim);text-align:center;padding:12px">No scans yet</div>';
    return;
  }
  el.innerHTML = history.map(h => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px;background:rgba(22,163,74,0.04);border-radius:var(--radius-sm);margin-bottom:6px;font-size:.78rem">
      <span>${h.emoji}</span>
      <div style="flex:1">
        <div style="font-weight:600">${h.disease}</div>
        <div style="color:var(--text-muted);font-size:.7rem">${h.time} · Health: ${h.healthPct}%</div>
      </div>
      <span class="ai-severity sev-${h.severity}" style="font-size:.65rem;padding:2px 8px">${capitalize(h.severity)}</span>
    </div>
  `).join('');
}

// ─── DRAG & DROP ───
function aiDragOver(e) { e.preventDefault(); document.getElementById('aiUploadZone')?.classList.add('drag-over'); }
function aiDragLeave() { document.getElementById('aiUploadZone')?.classList.remove('drag-over'); }
function aiDrop(e) {
  e.preventDefault();
  document.getElementById('aiUploadZone')?.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = (ev) => showImageAndScan(ev.target.result, randomInt(0, ASH.diseases.length - 1));
    reader.readAsDataURL(file);
  }
}

// ─── GENERATE CERT FROM AI ───
function generateCertFromAI() {
  if (lastDetectedDisease) {
    // Store AI result for certificate
    Session.set('lastAIResult', lastDetectedDisease);
  }

// --- js/iot.js ---
// ============================================================
// AgroSmartHub 3.0 — IoT Live Sensor Monitoring
// Realtime: Supabase channel → iot_readings table
// Fallback: Client-side simulation (setInterval)
// ============================================================

let iotInterval = null;
let iotRealtimeChannel = null; // Supabase Realtime channel

function renderIoTMonitor(container) {
  updateTopbar('IoT Sensor Monitor', 'Real-time farm environment data');

  container.innerHTML = `
    <!-- Live Indicator -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(22,163,74,0.1);border:1px solid rgba(22,163,74,0.25);border-radius:var(--radius-full)">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--green-400);animation:sensor-blink 1s infinite"></span>
        <span id="iotLiveLabel" style="font-size:.78rem;font-weight:700;color:var(--green-400)">LIVE — Updates every 3s</span>
      </div>
      <div style="font-size:.75rem;color:var(--text-muted)">Device: <strong>IoT-Gateway-001</strong> · Farm: ${currentUser.farmName || "Ramu's Green Agro Farm"}</div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button onclick="exportSensorData()" style="padding:6px 14px;background:rgba(22,163,74,0.1);border:1px solid var(--border);border-radius:var(--radius-full);color:var(--green-400);font-size:.75rem;font-weight:600;cursor:pointer;font-family:Outfit,sans-serif">📥 Export</button>
        <button onclick="resetAlerts()" style="padding:6px 14px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-full);color:var(--red-400);font-size:.75rem;font-weight:600;cursor:pointer;font-family:Outfit,sans-serif">🔕 Clear Alerts</button>
      </div>
    </div>

    <!-- Alert Bar -->
    <div id="iotAlertBar" style="display:none;margin-bottom:16px;padding:12px 16px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-md)">
      <div style="display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--red-400)">
        🚨 <span id="iotAlertText">Alert detected</span>
      </div>
    </div>

    <!-- Sensor Grid -->
    <div class="iot-grid" id="iotSensorGrid"></div>

    <!-- Trend Charts -->
    <div class="chart-grid" style="margin-top:24px">

        <canvas id="iotTempChart" height="180"></canvas>

        <table class="admin-table" id="iotDataTable">
          <thead>
            <tr><th>Sensor</th><th>Current Value</th><th>Min (24h)</th><th>Max (24h)</th><th>Status</th><th>Last Update</th></tr>

  subscribeIoTRealtime();
